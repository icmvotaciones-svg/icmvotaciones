<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Votaciones</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            text-align: center;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 12px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .oculto {
            display: none;
        }

        #candidatos {
            margin-top: 20px;
        }

        .candidato {
            background: white;
            padding: 20px;
            margin: 15px auto;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .candidato h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- ========================= -->
        <!--          INICIO            -->
        <!-- ========================= -->

        <section id="inicio">

            <h1>🗳️ Sistema de Votaciones</h1>

            <p>Bienvenido al sistema de votaciones</p>

            <p><strong>Selecciona tu grado para continuar</strong></p>

            <button onclick="seleccionarGrado('10-01')">
                Grado 10-01
            </button>

            <button onclick="seleccionarGrado('10-02')">
                Grado 10-02
            </button>

            <button onclick="seleccionarGrado('11-01')">
                Grado 11-01
            </button>

            <button onclick="seleccionarGrado('11-02')">
                Grado 11-02
            </button>

        </section>


        <!-- ========================= -->
        <!--        ELECCIONES           -->
        <!-- ========================= -->

        <section id="elecciones" class="oculto">

            <h2 id="gradoSeleccionado"></h2>

            <p>
                Selecciona el candidato por el que deseas votar:
            </p>

            <div id="candidatos"></div>

        </section>

    </div>


    <!-- ========================= -->
    <!--        JAVASCRIPT          -->
    <!-- ========================= -->

    <script src="app.js"></script>

</body>
</html>
